version: "2"

run:
  tests: false
  timeout: 5m

output:
  formats:
    text:
      path: stdout
      print-issued-lines: false

formatters:
  enable:
    - goimports
  exclusions:
    paths:
      - generated
      - mocks
      - ".*easyjson\\.go$"

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - revive
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nlreturn
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - prealloc
  settings:
    dupl:
      threshold: 100
    lll:
      line-length: 120
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - performance
        - style
        - experimental
    gosec:
      excludes:
        - G115
        - G302
        - G304
        - G306
        - G703
  exclusions:
    paths:
      - generated
      - mocks
      - ".*easyjson\\.go$"
    rules:
      - linters:
          - revive
        text: "^(exported|package-comments):"
      - linters:
          - nlreturn
        path: ".*"
